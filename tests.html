<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelf Life tests</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #faf8f3; color: #1f2a24; margin: 0 auto; max-width: 820px; padding: 16px; }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.15rem; margin-top: 1.5rem; }
    #summary { font-size: 1.2rem; font-weight: 700; padding: 12px; border-radius: 10px; border: 2px solid currentColor; }
    #summary.ok { color: #1d5c3a; }
    #summary.bad { color: #9b1c1c; }
    ul { list-style: none; padding: 0; }
    li { padding: 6px 8px; border-bottom: 1px solid #e3ded3; }
    .tag { display: inline-block; min-width: 3.5em; font-weight: 700; }
    .pass .tag { color: #1d5c3a; }
    .fail .tag { color: #9b1c1c; }
    .msg { display: block; font-size: .9rem; color: #5a4a3a; margin-left: 3.5em; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Shelf Life tests</h1>
  <p id="summary" role="status">Running…</p>
  <div id="results"></div>

  <script src="data/ingredients.js"></script>
  <script src="data/swaps.js"></script>
  <script src="data/profiles.js"></script>
  <script src="data/fridges.js"></script>
  <script src="data/recipes.js"></script>
  <script src="data/prices.js"></script>
  <script src="js/util.js"></script>
  <script src="js/safety.js"></script>
  <script src="js/screens/recipes.js"></script>
  <script src="js/screens/list.js"></script>
  <script src="js/tests.js"></script>
</body>
</html>
